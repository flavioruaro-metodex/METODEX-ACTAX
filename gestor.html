<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="METODEX Gestor">
<meta name="theme-color" content="#0f2742">
<link rel="manifest" href="manifest-gestor.webmanifest"><link rel="icon" href="assets/icone_192.png"><link rel="apple-touch-icon" href="assets/icone_192.png"><title>METODEX Gestor - Demonstracao</title>
<style>
:root{--bg:#f4f6f9;--surf:#fff;--ink:#0f2742;--mut:#5b6b7d;--line:#d5dce5;--zebra:#f6f8fb;--gold:#c8962e;--v:#1e8e4e;--a:#d08a00;--c:#c0392b;--n:#7f8c8d;--blue:#2b5f9e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow-x:hidden;padding-bottom:calc(66px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:400px;text-align:center}
.lockbox h1{font-size:19px;margin-bottom:4px}.lockbox p{color:var(--mut);font-size:12px;margin-bottom:4px}
.lockbox form{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px}.lockbox input{padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:600;cursor:pointer;font-size:14px}.lockerr{color:var(--c);min-height:18px;font-size:12px}
.lockup{display:inline-flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid #c8962e;box-shadow:0 4px 14px rgba(15,39,66,.22);margin-bottom:14px;background:#fff}
.lockup .lk-m{background:#0b1a33;display:flex;align-items:center}.lockup .lk-m img{height:74px;width:auto;display:block}
.lockup .lk-a{display:flex;align-items:center;padding:0 18px;border-left:2px solid #c8962e;background:#fff}.lockup .lk-a img{height:36px;width:auto;display:block}
.lockup.xs{border-radius:7px;margin:0;box-shadow:none}.lockup.xs .lk-m img{height:28px}.lockup.xs .lk-a{padding:0 9px}.lockup.xs .lk-a img{height:14px}
header{background:var(--surf);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.hd1{display:flex;justify-content:space-between;align-items:center;gap:8px}.hd1 h2{font-size:16px}.hd1 .sub{color:var(--mut);font-size:11px}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.filtros label{font-size:10px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.filtros select{border:1px solid var(--line);border-radius:7px;padding:6px;font-size:13px;background:#fff;color:var(--ink);width:100%;min-height:36px}
.apps{display:flex;gap:6px;margin-top:6px;overflow-x:auto}.apps a{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:3px 9px;color:var(--ink);text-decoration:none;white-space:nowrap}.apps a.on{background:var(--ink);color:#fff}
.chip{font-size:10px;border-radius:10px;padding:2px 8px;font-weight:600;background:#fdf0dc;color:#9a6400;white-space:nowrap}
main{padding:10px 10px 16px}
.cards{display:grid;gap:8px;margin-bottom:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--n);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.card.v{border-left-color:var(--v)}.card.a{border-left-color:var(--a)}.card.c{border-left-color:var(--c)}
.card .t{font-size:11.5px;font-weight:600}.card .val{font-size:20px;font-weight:700;margin-top:1px}.card .ln{font-size:10.8px;color:var(--mut);line-height:1.35}
.box{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px;overflow-x:auto}
.box h3{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}.box h3 small{font-weight:400;color:var(--mut);font-size:10.5px}
.veredito{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:1.45}.veredito b{color:var(--gold)}
.li{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}.li:last-child{border:0}
.dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none}.dot.c{background:var(--c)}.dot.a{background:var(--a)}.dot.v{background:var(--v)}.dot.n{background:var(--n)}
.li .tx{flex:1;font-size:13px;line-height:1.35}.li .tx small{display:block;color:var(--mut);font-size:11px}.li .vl{font-weight:700;white-space:nowrap;font-size:12px}
.prog{height:10px;background:#e6ebf1;border-radius:6px;overflow:hidden;margin:4px 0 8px}.prog i{display:block;height:100%;background:var(--v)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch}.chips button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 12px;font-size:12px;white-space:nowrap;color:var(--ink)}.chips button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:5px 6px;white-space:nowrap}td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
.leg{font-size:10.5px;color:var(--mut);margin-top:4px}svg text{font-family:inherit}.box svg{min-width:480px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;z-index:30;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #2a4566}
nav button{flex:1;background:none;border:0;color:#cfd9e6;font-size:11px;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button b{color:var(--gold);font-size:15px}nav button.on{background:#1d3d63;color:#fff}
@media (min-width:900px){main{max-width:900px;margin:0 auto}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

.sw{display:inline-flex;gap:5px;align-items:center}.sw .ic{width:34px;height:34px;border-radius:9px;color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none;letter-spacing:.2px;border:2px solid transparent;box-shadow:0 1px 3px rgba(15,39,66,.3)}
.sw .ceo{background:#0f2742;color:#f2c96b}.sw .tat{background:#1f8a8a}.sw .ges{background:#2e9e5b}.sw .ope{background:#e07b20}.sw .ic.on{border-color:#c8962e;box-shadow:0 0 0 2px #fff,0 0 0 4px #c8962e}
.inst{border:1px solid #c8962e;background:#fff8e6;color:#7a5200;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
</style>
</head>

let ALL = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') throw new Error('NAVEGADOR');
  const sal = b64(PACOTE.sal), ctr = b64(PACOTE.ctr), mac = b64(PACOTE.mac), dados = b64(PACOTE.dados);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: PACOTE.iter}, base, 512));
  const kMac = await crypto.subtle.importKey('raw', bits.slice(32), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const msg = new Uint8Array(32 + dados.length); msg.set(sal, 0); msg.set(ctr, 16); msg.set(dados, 32);
  if (!await crypto.subtle.verify('HMAC', kMac, mac, msg)) throw new Error('SENHA');
  const kAes = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CTR', false, ['decrypt']);
  const comp = await crypto.subtle.decrypt({name: 'AES-CTR', counter: ctr, length: 128}, kAes, dados);
  return new Response(new Blob([comp]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
}
document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const inp = document.getElementById('senha'), bt = document.getElementById('entrar'), er = document.getElementById('lockerr');
  if (!inp.value) { er.textContent = 'Digite a senha.'; return; }
  bt.disabled = true; bt.textContent = 'Abrindo...'; er.textContent = '';
  try { try { sessionStorage.setItem('mx_pw', inp.value); } catch (x) {} ALL = JSON.parse(await abrir(inp.value)); inp.value = ''; document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false; iniciar(); }
  catch (e) { er.textContent = e.message === 'SENHA' ? 'Senha incorreta.' : e.message === 'NAVEGADOR' ? 'Abra no Chrome, Edge, Safari ou Firefox atualizado.' : 'Nao foi possivel abrir.'; bt.disabled = false; bt.textContent = 'Entrar'; }
});
(async () => { try { const pw = sessionStorage.getItem('mx_pw'); if (!pw) return; ALL = JSON.parse(await abrir(pw)); document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false; iniciar(); } catch (e) {} })();

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d) => Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const ok = v => v != null && isFinite(v);
const BRL = v => { if (!ok(v)) return '-'; const a = Math.abs(v), s = v < -0.5 ? '-' : ''; if (a >= 1e6) return s + 'R$ ' + nf(a/1e6, 2) + ' mi'; if (a >= 1e4) return s + 'R$ ' + nf(a/1e3, 1) + ' mil'; return s + 'R$ ' + nf(a, 0); };
const PCT = (v, d) => ok(v) ? nf(v * 100, d == null ? 1 : d) + '%' : '-';
const dd = d => d.slice(8, 10) + '/' + d.slice(5, 7);
const DOWN = ['seg', 'ter', 'qua', 'qui', 'sex', 'sab', 'dom'];
const S = {tab: 0, loja: '1', d: null, setor: 'Todos', exec: 'Todos'};
const L = () => ALL.L[S.loja];
const DIA = () => L().dias.find(x => x.d === S.d);
const TABS = [['Hoje', '★'], ['Tarefas', '✓'], ['Acoes', '⚑'], ['Indicadores', '▤'], ['Alertas', '⚠']];
function card(o) { return '<div class="card ' + (o.f || '') + '"><div class="t">' + o.n + '</div><div class="val">' + o.v + '</div>' + (o.l || []).map(x => '<div class="ln">' + x + '</div>').join('') + '</div>'; }
function farol(r, m, menor) { if (!ok(r) || !ok(m) || !m) return ''; const q = menor ? m / r : r / m; return q >= 1 ? 'v' : q >= 0.93 ? 'a' : 'c'; }
function barras(series, rot, fmt) {
  const W = 640, H = 180, pl = 54, pb = 22, pt = 8, pr = 6; fmt = fmt || BRL;
  const vals = series.flatMap(s => s.v.filter(ok)); const mx = (Math.max(0, ...vals) || 1) * 1.08, mn = 0;
  const n = rot.length, bw = (W - pl - pr) / n, y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  for (let k = 0; k <= 3; k++) { const v = mn + (mx - mn) * k / 3; g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e3e8ee"/><text x="' + (pl - 4) + '" y="' + (y(v) + 3) + '" font-size="9" text-anchor="end" fill="#5b6b7d">' + fmt(v) + '</text>'; }
  series.forEach((s, j) => { const w = bw * 0.8 / series.length; s.v.forEach((v, i) => { if (!ok(v)) return; const x = pl + i * bw + bw * 0.1 + j * w; g += '<rect x="' + x + '" y="' + y(v) + '" width="' + (w - 1) + '" height="' + Math.max(1, y(0) - y(v)) + '" fill="' + s.cor + '"><title>' + esc(rot[i] + ' - ' + s.nome + ': ' + fmt(v)) + '</title></rect>'; }); });
  rot.forEach((r, i) => g += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 7) + '" font-size="9" text-anchor="middle" fill="#5b6b7d">' + esc(r) + '</text>');
  return g + '</svg><div class="leg">' + series.map(s => '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:12px;height:10px;background:' + s.cor + ';display:inline-block"></span>' + esc(s.nome) + '</span>').join('') + '</div>';
}
const SN = s => L().setor_nome[s] || s;

/* ---------- Hoje ---------- */
function p0() {
  const l = L(), x = DIA(), i = l.dias.indexOf(x), sem = l.dias[i - 7], q = l.quebra[x.d];
  const tar = l.tarefas, nr = tar.filter(t => t.status === 'Nao realizada'), cat = tar.filter(t => t.status === 'Concluida com atraso').length, atr = l.plano.filter(p => p.status === 'Atrasada');
  const v3 = l.validade.itens.filter(i2 => i2.dias <= 3), rv = l.validade.itens.filter(i2 => i2.dias <= 3).reduce((a, b) => a + b.valor, 0);
  const pm = x.meta ? x.venda / x.meta : null;
  let h = '<div class="veredito">Em <b>' + dd(x.d) + ' (' + DOWN[x.dow] + ')</b> a loja vendeu <b>' + BRL(x.venda) + '</b>' + (pm ? ', <b>' + PCT(pm, 0) + '</b> da meta do dia' : '') + '. ' +
    (nr.length ? '<b>' + nr.length + ' tarefa(s) nao realizada(s)</b>' : 'Todas as tarefas feitas') + ' e <b>' + atr.length + ' acao(oes) atrasada(s)</b>.</div>';
  h += '<div class="cards">' + card({n: 'Venda do dia', v: BRL(x.venda), f: farol(x.venda, x.meta), l: ['meta ' + BRL(x.meta) + ' - ' + PCT(pm, 0)]}) +
    card({n: 'Ticket medio', v: 'R$ ' + nf(x.ticket, 2), l: [sem ? 'mesmo dia semana passada R$ ' + nf(sem.ticket, 2) : '']}) +
    card({n: 'Clientes', v: nf(x.cup, 0), l: [sem ? 'semana passada ' + nf(sem.cup, 0) : '']}) +
    card({n: 'Quebra do dia', v: q ? BRL(q.total) : '-', f: q ? farol(q.pct, 2.2, true) : '', l: [q ? nf(q.pct, 2) + '% da venda (meta 2,2%)' : 'sem lancamentos']}) +
    card({n: 'Itens em ruptura', v: nf(l.rup.sinalizados, 0), f: l.rup.sinalizados > l.rup.monitorados * 0.07 ? 'a' : 'v', l: ['de ' + nf(l.rup.monitorados, 0) + ' monitorados']}) +
    card({n: 'Vencendo em ate 3 dias', v: BRL(rv), f: rv > 0 ? 'a' : 'v', l: [v3.length + ' itens para agir']}) + '</div>';
  const it = [];
  nr.forEach(t => it.push({f: 'c', t: esc(t.tarefa) + '<small>' + esc(t.setor) + ' - ' + esc(t.resp) + ' - limite ' + t.limite + '</small>', v: 'Nao feita'}));
  atr.slice(0, 4).forEach(p => it.push({f: 'c', t: esc(p.o_que) + '<small>' + esc(p.executor) + ' - prazo ' + dd(p.prazo) + '</small>', v: BRL(p.impacto)}));
  l.rup.itens.slice(0, 3).forEach(r => it.push({f: 'a', t: esc(r.nome) + '<small>sem venda ha ' + r.dias + ' dias - ' + esc(r.causa) + ' - ' + esc(r.acao) + '</small>', v: SN(r.sec)}));
  v3.slice(0, 3).forEach(r => it.push({f: r.dias === 0 ? 'c' : 'a', t: esc(r.nome) + '<small>vence ' + (r.dias === 0 ? 'hoje' : 'em ' + r.dias + ' d') + ' - ' + esc(r.acao) + '</small>', v: BRL(r.valor)}));
  h += '<div class="box"><h3>Pendencias para agir <small>' + it.length + ' itens</small></h3>' + (it.length ? it.map(z => '<div class="li"><span class="dot ' + z.f + '"></span><span class="tx">' + z.t + '</span><span class="vl">' + z.v + '</span></div>').join('') : '<p class="leg">Nada pendente.</p>') + '</div>';
  const u = l.dias.slice(-14);
  h += '<div class="box"><h3>Venda 14 dias x meta diaria</h3>' + barras([{nome: 'Venda', cor: '#2b5f9e', v: u.map(z => z.venda)}, {nome: 'Meta', cor: '#c8962e', v: u.map(z => z.meta)}], u.map(z => dd(z.d))) + '</div>';
  return h;
}
/* ---------- Tarefas ---------- */
function p1() {
  const l = L(); const setores = ['Todos'].concat(Array.from(new Set(l.tarefas.map(t => t.setor))));
  const lista = l.tarefas.filter(t => S.setor === 'Todos' || t.setor === S.setor); const feitas = lista.filter(t => t.status !== 'Nao realizada').length;
  let h = '<div class="chips">' + setores.map(s => '<button class="' + (s === S.setor ? 'on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>';
  h += '<div class="box"><h3>Rotina do dia ' + dd(S.d) + ' <small>' + feitas + ' de ' + lista.length + ' realizadas (' + PCT(lista.length ? feitas / lista.length : 0, 0) + ')</small></h3><div class="prog"><i style="width:' + (lista.length ? feitas / lista.length * 100 : 0) + '%"></i></div>' +
    lista.map(t => '<div class="li"><span class="dot ' + (t.status === 'Concluida' ? 'v' : t.status === 'Concluida com atraso' ? 'a' : 'c') + '"></span><span class="tx">' + esc(t.tarefa) + '<small>' + esc(t.setor) + ' - ' + esc(t.resp) + ' - limite ' + t.limite + '</small></span><span class="vl">' + (t.status === 'Concluida' ? 'OK' : t.status === 'Concluida com atraso' ? 'Atraso' : 'Nao feita') + '</span></div>').join('') + '</div>';
  return h;
}
/* ---------- Acoes ---------- */
function p2() {
  const l = L(), ex = ['Todos'].concat(Array.from(new Set(l.plano.map(p => p.executor)))); const lista = l.plano.filter(p => p.status !== 'Concluida' && (S.exec === 'Todos' || p.executor === S.exec)).sort((a, b) => (a.status === 'Atrasada' ? 0 : 1) - (b.status === 'Atrasada' ? 0 : 1) || a.prazo.localeCompare(b.prazo));
  let h = '<div class="chips">' + ex.map(s => '<button data-e="' + esc(s) + '" class="' + (s === S.exec ? 'on' : '') + '">' + esc(s) + '</button>').join('') + '</div>';
  h += '<div class="box"><h3>Plano de acao 5W2H <small>' + lista.length + ' abertas - ' + lista.filter(p => p.status === 'Atrasada').length + ' atrasadas</small></h3>' +
    lista.map(p => '<div class="li"><span class="dot ' + (p.status === 'Atrasada' ? 'c' : p.status === 'Em andamento' ? 'a' : 'n') + '"></span><span class="tx"><b>' + esc(p.id) + '</b> ' + esc(p.o_que) + '<small>Por que: ' + esc(p.por_que) + '</small><small>Quem: ' + esc(p.executor) + ' - Prazo ' + dd(p.prazo) + ' - ' + esc(p.status) + '</small><small>Indicador: ' + esc(p.indicador || '-') + ' (meta ' + esc(p.meta || '-') + ')</small></span><span class="vl">' + BRL(p.impacto) + '</span></div>').join('') + '</div>';
  return h;
}
/* ---------- Indicadores ---------- */
function p3() {
  const l = L(); const fm = (k) => k[5] === '%' ? nf(k[2], 1) + '%' : k[5] === 'R$' ? 'R$ ' + nf(k[2], 2) : nf(k[2], 0);
  let h = '<div class="box"><h3>Itens de controle da semana <small>ultimos 7 dias</small></h3>' + l.kpis.map(k => '<div class="li"><span class="dot ' + (k[4] || 'n') + '"></span><span class="tx">' + esc(k[1]) + '<small>' + esc(k[0]) + ' - meta/ref. ' + (k[5] === '%' ? nf(k[3], 1) + '%' : k[5] === 'R$' ? 'R$ ' + nf(k[3], 2) : nf(k[3], 0)) + '</small></span><span class="vl">' + fm(k) + '</span></div>').join('') + '</div>';
  const u = l.dias.slice(-14);
  h += '<div class="box"><h3>Ticket medio 14 dias</h3>' + barras([{nome: 'Ticket', cor: '#3a8f8a', v: u.map(z => z.ticket)}], u.map(z => dd(z.d))) + '</div>';
  return h;
}
/* ---------- Alertas ---------- */
function p4() {
  const l = L(), q = l.quebra[S.d];
  let h = '<div class="box"><h3>Ruptura <small>itens que precisam de acao</small></h3>' + l.rup.itens.map(r => '<div class="li"><span class="dot ' + (r.dias >= 5 ? 'c' : 'a') + '"></span><span class="tx">' + esc(r.nome) + '<small>' + SN(r.sec) + ' - ' + esc(r.causa) + ' - saldo ' + r.saldo + '</small><small>Acao: ' + esc(r.acao) + '</small></span><span class="vl">' + r.dias + ' d</span></div>').join('') + '</div>';
  h += '<div class="box"><h3>Validade <small>proximos 7 dias</small></h3>' + l.validade.itens.map(r => '<div class="li"><span class="dot ' + (r.dias <= 1 ? 'c' : r.dias <= 3 ? 'a' : 'n') + '"></span><span class="tx">' + esc(r.nome) + '<small>' + SN(r.sec) + ' - ' + r.qtd + ' un - ' + (r.dias === 0 ? 'vence hoje' : 'vence em ' + r.dias + ' d') + '</small><small>Acao: ' + esc(r.acao) + '</small></span><span class="vl">' + BRL(r.valor) + '</span></div>').join('') + '</div>';
  if (q) h += '<div class="box"><h3>Maiores quebras do dia <small>' + BRL(q.total) + ' no total</small></h3>' + q.itens.map(r => '<div class="li"><span class="dot a"></span><span class="tx">' + esc(r.nome) + '<small>' + SN(r.sec) + ' - ' + esc(r.motivo) + ' - ' + esc(r.quem) + '</small></span><span class="vl">' + BRL(r.valor) + '</span></div>').join('') + '</div>';
  return h;
}
const FN = [p0, p1, p2, p3, p4];
function render() {
  $('#titulo').textContent = TABS[S.tab][0]; $('#subt').textContent = ALL.meta.lojas.find(x => x.id === S.loja).nome + ' - dia ' + dd(S.d) + ' - dados simulados';
  document.querySelectorAll('#nav button').forEach((b, i) => b.classList.toggle('on', i === S.tab));
  $('#pg').innerHTML = FN[S.tab](); window.scrollTo(0, 0);
}
function iniciar() {
  $('#nav').innerHTML = TABS.map((t, i) => '<button data-i="' + i + '"><b>' + t[1] + '</b>' + t[0] + '</button>').join('');
  $('#nav').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; S.tab = +b.dataset.i; render(); });
  $('#pg').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; if (b.dataset.s) { S.setor = b.dataset.s; render(); } if (b.dataset.e) { S.exec = b.dataset.e; render(); } });
  $('#fLoja').innerHTML = ALL.meta.lojas.map(x => '<option value="' + x.id + '">' + esc(x.nome) + '</option>').join('');
  S.d = ALL.meta.ref; const popDias = () => { $('#fDia').innerHTML = L().dias.slice(-14).reverse().map(x => '<option value="' + x.d + '">' + dd(x.d) + ' (' + DOWN[x.dow] + ')</option>').join(''); $('#fDia').value = S.d; };
  popDias();
  $('#fLoja').onchange = e => { S.loja = e.target.value; S.setor = 'Todos'; S.exec = 'Todos'; popDias(); render(); }; $('#fDia').onchange = e => { S.d = e.target.value; render(); };
  render();
}
