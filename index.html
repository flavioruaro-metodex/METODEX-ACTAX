<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="METODEX CEO">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f2742"><link rel="icon" href="assets/icone_192.png"><link rel="apple-touch-icon" href="assets/icone_192.png"><title>METODEX CEO - Demonstracao</title>
<style>
:root{--bg:#f4f6f9;--surf:#ffffff;--ink:#0f2742;--mut:#5b6b7d;--line:#d5dce5;--zebra:#f6f8fb;--gold:#c8962e;
--v:#1e8e4e;--a:#d08a00;--c:#c0392b;--n:#7f8c8d;--blue:#2b5f9e;--blue2:#9bb8dc;--teal:#3a8f8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
[hidden]{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:30px;width:100%;max-width:400px;text-align:center}
.lockbox img.lf{height:58px;margin-bottom:14px}.lockbox h1{font-size:19px;margin-bottom:4px}.lockbox p{color:var(--mut);font-size:12px}
.lockbox form{display:flex;flex-direction:column;gap:10px;margin:18px 0 8px}
.lockbox input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
.lockerr{color:var(--c);min-height:18px;font-size:12px}.lgpar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}.lgpar img{height:54px;width:auto;object-fit:contain}.lgx{color:var(--mut);font-size:22px}.lgpar.sm{gap:6px;margin:0}.lgpar.sm img{height:30px;max-width:92px}
.lockup{display:inline-flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid #c8962e;box-shadow:0 4px 14px rgba(15,39,66,.22);margin-bottom:14px;background:#fff}
.lockup .lk-m{background:#0b1a33;display:flex;align-items:center}.lockup .lk-m img{height:74px;width:auto;display:block}
.lockup .lk-a{display:flex;align-items:center;padding:0 18px;border-left:2px solid #c8962e;background:#fff}.lockup .lk-a img{height:36px;width:auto;display:block}
.lockup.sm{border-radius:8px;margin:0;box-shadow:none;width:100%}.lockup.sm .lk-m img{height:38px}.lockup.sm .lk-a{padding:0 8px;flex:1;justify-content:center}.lockup.sm .lk-a img{height:18px}
.lockup.xs{border-radius:7px;margin:0;box-shadow:none}.lockup.xs .lk-m img{height:28px}.lockup.xs .lk-a{padding:0 9px}.lockup.xs .lk-a img{height:15px}
nav .lg{padding:0;background:none}.mlogo{margin-bottom:5px}
.lockbox img.lm{height:40px;margin-top:14px}
#app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
nav{background:var(--ink);color:#fff;padding:12px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
nav .lg{background:#fff;border-radius:8px;padding:8px;text-align:center;margin-bottom:12px}nav .lg img{height:44px}
nav button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:#cfd9e6;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer}
nav button b{color:var(--gold);width:14px}nav button.on{background:#1d3d63;color:#fff}nav button:hover{background:#18365a}
nav .rod{margin-top:auto;font-size:10.5px;color:#9fb1c6;text-align:center}nav .rod img{height:34px;display:block;margin:0 auto 6px;border-radius:4px}
main{min-width:0}
header{background:var(--surf);border-bottom:1px solid var(--line);padding:8px 16px;position:sticky;top:0;z-index:5}
.hd1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hd1 h2{font-size:17px}.hd1 .sub{color:var(--mut);font-size:11.5px}
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.filtros label{font-size:11px;color:var(--mut);display:flex;gap:5px;align-items:center}
.filtros select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:var(--ink)}
.chip{font-size:10.5px;border-radius:10px;padding:2px 8px;font-weight:600;display:inline-block;white-space:nowrap}
.s-Completo{background:#e3f4ea;color:var(--v)}.s-Parcial{background:#fdf0dc;color:#9a6400}.s-Fiscal{background:#e6eef8;color:var(--blue)}
.s-Previa{background:#eee;color:#555}.s-Insuficiente{background:#fbe4e2;color:var(--c)}
.lnk{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11.5px;cursor:pointer;color:var(--ink)}
section.pg{padding:12px 16px 30px}
.cards{display:grid;gap:8px;margin-bottom:10px}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--n);border-radius:9px;padding:8px 10px;min-height:118px;display:flex;flex-direction:column;gap:2px}
.card.v{border-left-color:var(--v)}.card.a{border-left-color:var(--a)}.card.c{border-left-color:var(--c)}
.card .t{font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;gap:4px;align-items:flex-start}
.card .val{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.card .ln{font-size:10.8px;color:var(--mut);line-height:1.35}
.card .ln b{color:var(--ink)}.card .rodc{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:10.3px}
.fr{font-size:10.5px;font-weight:700;white-space:nowrap}.fr.v{color:var(--v)}.fr.a{color:var(--a)}.fr.c{color:var(--c)}.fr.n{color:var(--n)}
.dono{color:var(--mut)}.dono.sem{color:var(--c);font-weight:600}
.risco{color:var(--c);font-weight:600}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-bottom:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.box h3{font-size:12.5px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.box h3 small{font-weight:400;color:var(--mut);font-size:10.5px}
table{width:100%;border-collapse:collapse;font-size:11.3px}
th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:4px 6px;border:1px solid #2a4566;position:sticky;top:0}
td{padding:3px 6px;border:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--zebra)}td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:#e9eef5}
.tw{max-height:340px;overflow:auto}
.msg{font-size:12px;line-height:1.5}.msg p{margin-bottom:6px}
.aviso{background:#fff8e6;border:1px solid #f0d59a;border-radius:8px;padding:6px 10px;font-size:11.5px;margin-bottom:10px}
.leg{font-size:10.5px;color:var(--mut);margin-top:4px}
svg text{font-family:inherit}
#modal{position:fixed;inset:0;background:rgba(15,39,66,.45);display:flex;align-items:center;justify-content:center;z-index:20}
#modal .in{background:#fff;border-radius:10px;padding:16px;max-width:760px;width:92%;max-height:80vh;overflow:auto}
@media (max-width:1100px){.c6{grid-template-columns:repeat(3,1fr)}.c5,.c4{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.grid2b{grid-template-columns:1fr}}
.dec{list-style:none}.dec li{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}.dec li:last-child{border:0}
.dec .dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}.dec .dot.c{background:var(--c)}.dec .dot.a{background:var(--a)}.dec .dot.v{background:var(--v)}
.dec .tx{flex:1;font-size:12.5px;line-height:1.35}.dec .tx small{display:block;color:var(--mut);font-size:11px}.dec .vl{font-weight:700;white-space:nowrap;font-size:12px}
.veredito{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.45}.veredito b{color:var(--gold)}
html,body{overflow-x:hidden}.box{overflow-x:auto}.mlogo,nav button .s{display:none}
button,select{-webkit-tap-highlight-color:transparent}
@media (max-width:760px){
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
 #app{display:block}
 nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:30;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;border-top:1px solid #2a4566;-webkit-overflow-scrolling:touch}
 nav .lg,nav .rod{display:none}
 #menu{display:flex;gap:2px;width:max-content}
 nav button{flex-direction:column;gap:1px;width:auto;min-width:66px;padding:6px 9px;font-size:10.5px;text-align:center;white-space:nowrap;align-items:center}
 nav button b{width:auto;font-size:13px}nav button .l{display:none}nav button .s{display:inline}
 header{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
 .mlogo{display:flex;align-items:center}
 .hd1 h2{font-size:17px}.hd1 .sub{font-size:10.5px;margin-top:2px}
 .hd1>div:last-child{width:100%;flex-wrap:wrap}.hd1 .lnk{padding:5px 8px}#selo,.hd1 .lnk[onclick]{display:none}
 .filtros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
 .filtros label{flex-direction:column;align-items:stretch;gap:2px;font-size:10px}.filtros select{width:100%;min-height:34px;font-size:12px}
 .filtros .leg{grid-column:1/-1}
 section.pg{padding:10px 10px 24px}
 .c6,.c5,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card{min-height:0;padding:8px;border-radius:8px}.card .t{font-size:11px;flex-wrap:wrap}.card .val{font-size:18px}.card .ln{font-size:10.3px}.card .rodc{flex-wrap:wrap;font-size:9.8px}
 .chip{font-size:9.5px;padding:1px 6px}
 .box{padding:9px 10px}.box h3{flex-wrap:wrap}
 .box svg{min-width:540px}
 table{font-size:11px}td,th{padding:3px 5px}.tw{max-height:none;overflow-x:auto}
 #modal .in{width:96%;padding:12px}
 .msg{font-size:12.5px}
}
@media print{nav,header .filtros,.lnk{display:none}#app{display:block}.card,.box{break-inside:avoid}}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') throw new Error('NAVEGADOR');
  const sal = b64(PACOTE.sal), ctr = b64(PACOTE.ctr), mac = b64(PACOTE.mac), dados = b64(PACOTE.dados);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: PACOTE.iter}, base, 512));
  const kMac = await crypto.subtle.importKey('raw', bits.slice(32), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const msg = new Uint8Array(32 + dados.length); msg.set(sal, 0); msg.set(ctr, 16); msg.set(dados, 32);
  if (!await crypto.subtle.verify('HMAC', kMac, mac, msg)) throw new Error('SENHA');
  const kAes = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CTR', false, ['decrypt']);
  const comp = await crypto.subtle.decrypt({name: 'AES-CTR', counter: ctr, length: 128}, kAes, dados);

  const inp = document.getElementById('senha'), bt = document.getElementById('entrar'), er = document.getElementById('lockerr');
  if (!inp.value) { er.textContent = 'Digite a senha.'; return; }
  bt.disabled = true; bt.textContent = 'Abrindo...'; er.textContent = '';
  try { ALL = JSON.parse(await abrir(inp.value)); E = ALL.todas; inp.value = ''; document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false; iniciar(); }
  catch (e) { er.textContent = e.message === 'SENHA' ? 'Senha incorreta.' : e.message === 'NAVEGADOR' ? 'Abra no Chrome, Edge, Safari ou Firefox atualizado.' : 'Nao foi possivel abrir o painel.'; bt.disabled = false; bt.textContent = 'Entrar'; }
});

/* ---------- utilitarios ---------- */
const $ = s => document.querySelector(s);
const NM = s => String(s == null ? '' : s).replace(/(,[0-9]+)+$/, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d) => Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const ok = v => v != null && isFinite(v);
const BRL = v => { if (!ok(v)) return '-'; const a = Math.abs(v), s = v < -0.5 ? '-' : ''; if (a >= 1e6) return s + 'R$ ' + nf(a/1e6, 2) + ' mi'; if (a >= 1e4) return s + 'R$ ' + nf(a/1e3, 1) + ' mil'; return s + 'R$ ' + nf(a, 0); };
const PCT = (v, d) => ok(v) ? nf(v * 100, d == null ? 1 : d) + '%' : '-';
const NUM = (v, d) => ok(v) ? nf(v, d || 0) : '-';
const PP = v => ok(v) ? (v >= 0 ? '+' : '') + nf(v * 100, 1) + ' p.p.' : '-';
const VAR = v => ok(v) ? (v >= 0 ? '+' : '') + nf(v * 100, 1) + '%' : '-';
const MESN = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ML = m => m ? MESN[+m.slice(5,7)-1] + '/' + m.slice(2,4) : '-';
const addM = (m, k) => { let y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + k; y += Math.floor(mo/12); mo = ((mo%12)+12)%12; return y + '-' + String(mo+1).padStart(2,'0'); };
const S = {pg: 0, m: null, loja: 'todas', cmp: 'aa'};
const PAG = [[0,'Hoje (resumo do CEO)','Hoje'],[1,'Visao do CEO','CEO'],[2,'Performance Comercial','Comercial'],[3,'Rentabilidade','Resultado'],[4,'Operacoes e Abastecimento','Operacao'],[5,'Quebras e Pereciveis','Quebras'],[6,'Financas e Caixa','Caixa'],[7,'Promocoes','Promo'],[8,'Plano de Acao','Acoes']];
const SIGLAS = [['ABC','Curva de classificacao: A = itens que somam 80% do valor, B = 15%, C = 5%'],['BP','Balanco Patrimonial'],['CMV','Custo da Mercadoria Vendida'],['DRE','Demonstracao do Resultado do Exercicio'],['EBITDA','Resultado operacional antes de juros, impostos sobre o lucro, depreciacao e amortizacao'],['ERP','Sistema de gestao da loja'],['FLV','Frutas, Legumes e Verduras (Hortifruti)'],['KPI','Indicador-chave de desempenho'],['PME / PMR / PMP','Prazo Medio de Estoque / de Recebimento / de Pagamento'],['p.p.','Pontos percentuais'],['RL','Receita Liquida'],['SKU','Codigo unico de produto'],['YoY','Comparacao com o mesmo periodo do ano anterior'],['5W2H','O que, por que, onde, quando, quem, como e quanto'],['Selo Fiscal','Numero da contabilidade fiscal; a DRE gerencial entra na Fase 2'],['Selo Parcial','Numero calculado com dado incompleto; ver dicionario de metricas'],['Selo Previa','Mes ainda nao fechado pela contabilidade: sem farol e sem percentual'],['Resultado em Risco','Quanto de margem deixa de entrar por estar abaixo da meta (R$)']];

/* ---------- dados do mes ---------- */
const V = m => E.V[m] || null;
const cmpM = m => S.cmp === 'aa' ? addM(m, -12) : addM(m, -1);
const cmpN = () => S.cmp === 'aa' ? 'ano ant.' : 'mes ant.';
function prop(m) { /* mes parcial: proporcional aos dias corridos com venda */ const v = V(m); if (!v || !v.parcial) return 1; const ref = +E.ref.slice(8, 10); return ref / v.dias; }
function metaMes(m) { const x = E.meta[m]; if (!x) return null; return {venda: x.venda * prop(m), margem: x.margem}; }
function farolR(real, meta, menor) { if (!ok(real) || !ok(meta) || meta === 0) return null; const r = menor ? meta / real : real / meta; return r >= 1 ? 'v' : r >= 0.9 ? 'a' : 'c'; }
function farolP(real, meta, tol, menor) { if (!ok(real) || !ok(meta)) return null; const d = (real - meta) * 100 * (menor ? -1 : 1); return d >= 0 ? 'v' : d >= -(tol || 1) ? 'a' : 'c'; }
const FRT = {v: 'na meta', a: 'atencao', c: 'critico'}; const FRS = {v: '✓', a: '!', c: '▼'};
function dono(cod) { const d = cod && E.donos ? E.donos[cod] : null; return d ? '<span class="dono">Resp.: ' + esc(d) + '</span>' : '<span class="dono sem">sem responsavel</span>'; }
function card(o) {
  const f = o.farol || null;
  return '<div class="card ' + (f || '') + '"><div class="t"><span>' + esc(o.nome) + '</span>' + (o.selo ? '<span class="chip s-' + o.selo + '">' + o.selo + '</span>' : '') + '</div>' +
    '<div class="val">' + o.valor + '</div>' + (o.linhas || []).map(l => '<div class="ln">' + l + '</div>').join('') +
    '<div class="rodc">' + (f ? '<span class="fr ' + f + '">' + FRS[f] + ' ' + FRT[f] + '</span>' : '<span class="fr n">sem farol</span>') + (o.cod !== undefined ? dono(o.cod) : '') + '</div>' +
    (o.risco > 0 ? '<div class="ln risco">Resultado em Risco ' + BRL(o.risco) + '</div>' : '') + '</div>';
}
function tabela(cab, linhas, numCols, tot, livre) {
  numCols = numCols || [];
  return '<div class="' + (livre ? '' : 'tw') + '"><table><thead><tr>' + cab.map((c, i) => '<th' + (numCols.includes(i) ? ' class="n"' : '') + '>' + c + '</th>').join('') + '</tr></thead><tbody>' +
    (tot ? '<tr class="tot">' + tot.map((c, i) => '<td' + (numCols.includes(i) ? ' class="n"' : '') + '>' + c + '</td>').join('') + '</tr>' : '') +
    linhas.map(l => '<tr>' + l.map((c, i) => '<td' + (numCols.includes(i) ? ' class="n"' : '') + '>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function frTxt(f) { return f ? '<span class="fr ' + f + '">' + FRS[f] + '</span>' : ''; }

/* ---------- graficos SVG simples ---------- */
function barras(series, rotulos, opt) {
  opt = opt || {}; const W = opt.w || 640, H = opt.h || 190, pl = 58, pb = 22, pt = 10, pr = 8;
  const vals = series.flatMap(s => s.v.filter(ok)); const mx = (Math.max(0, ...vals) || 1) * 1.08; const mn = Math.min(0, ...vals) * 1.08;
  const n = rotulos.length, bw = (W - pl - pr) / n, y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">';
  for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4; g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e3e8ee"/><text x="' + (pl - 4) + '" y="' + (y(v) + 3) + '" font-size="9" text-anchor="end" fill="#5b6b7d">' + (opt.fmt || BRL)(v) + '</text>'; }
  const bars = series.filter(s => s.tipo !== 'linha'), lines = series.filter(s => s.tipo === 'linha');
  bars.forEach((s, j) => { const w = bw * 0.7 / bars.length; s.v.forEach((v, i) => { if (!ok(v)) return; const x = pl + i * bw + bw * 0.15 + j * w; const y0 = y(Math.max(0, v)), y1 = y(Math.min(0, v));
    g += '<rect x="' + x + '" y="' + y0 + '" width="' + (w - 1) + '" height="' + Math.max(1, y1 - y0) + '" fill="' + (s.cores ? s.cores[i] : s.cor) + '" opacity="' + (s.op || 1) + '"><title>' + esc(rotulos[i] + ' - ' + s.nome + ': ' + (opt.fmt || BRL)(v)) + '</title></rect>'; }); });
  lines.forEach(s => { let d = ''; s.v.forEach((v, i) => { if (!ok(v)) return; const x = pl + i * bw + bw / 2; d += (d ? 'L' : 'M') + x + ' ' + y(v); });
    g += '<path d="' + d + '" fill="none" stroke="' + s.cor + '" stroke-width="2" ' + (s.tra ? 'stroke-dasharray="5 4"' : '') + '/>';
    s.v.forEach((v, i) => { if (ok(v)) g += '<circle cx="' + (pl + i * bw + bw / 2) + '" cy="' + y(v) + '" r="2.6" fill="' + s.cor + '"><title>' + esc(rotulos[i] + ' - ' + s.nome + ': ' + (opt.fmt || BRL)(v)) + '</title></circle>'; }); });
  rotulos.forEach((r, i) => g += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 7) + '" font-size="9.5" text-anchor="middle" fill="#5b6b7d">' + esc(r) + '</text>');
  g += '</svg><div class="leg">' + series.map(s => '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><span style="width:12px;height:' + (s.tipo === 'linha' ? 2 : 10) + 'px;background:' + s.cor + ';display:inline-block"></span>' + esc(s.nome) + '</span>').join('') + '</div>';
  return g;
}
function cascata(itens) {
  const W = 640, H = 200, pl = 8, pb = 34, pt = 10; let acc = 0; const pts = [];
  itens.forEach(it => { if (it.total) { pts.push({n: it.n, a: 0, b: it.v, t: 1}); acc = it.v; } else { pts.push({n: it.n, a: acc, b: acc + it.v, t: 0}); acc += it.v; } });
  const mx = Math.max(...pts.map(p => Math.max(p.a, p.b))) * 1.05, mn = Math.min(0, ...pts.map(p => Math.min(p.a, p.b)));
  const n = pts.length, bw = (W - pl * 2) / n, y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  g += '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#9aa7b5"/>';
  pts.forEach((p, i) => { const x = pl + i * bw + bw * 0.12, w = bw * 0.76, top = y(Math.max(p.a, p.b)), h = Math.max(1, Math.abs(y(p.a) - y(p.b)));
    const cor = p.t ? '#2b5f9e' : (p.b >= p.a ? '#1e8e4e' : '#c0392b');
    g += '<rect x="' + x + '" y="' + top + '" width="' + w + '" height="' + h + '" fill="' + cor + '"/><text x="' + (x + w / 2) + '" y="' + (top - 3) + '" font-size="9.5" text-anchor="middle" fill="#0f2742">' + BRL(p.t ? p.b : p.b - p.a) + '</text>' +
      '<text x="' + (x + w / 2) + '" y="' + (H - 20) + '" font-size="9" text-anchor="middle" fill="#5b6b7d">' + esc(p.n) + '</text>'; });
  return g + '</svg><div class="leg">azul = subtotal - verde = soma - vermelho = reduz</div>';
}

/* ---------- calculos comuns ---------- */
function mesesAte(m, k) { const r = []; for (let i = k - 1; i >= 0; i--) r.push(addM(m, -i)); return r.filter(x => E.V[x]); }
function margemSec(s, m) { const x = E.SEC[s] && E.SEC[s][m]; return x && x[2] ? x[3] / x[2] : null; }
function riscoSecoes(m) {
  const out = []; const ms = E.meta_sec[m] || {}; const p = prop(m);
  Object.keys(E.sec_nome).forEach(s => { const x = E.SEC[s] && E.SEC[s][m]; const mt = ms[s]; if (!x || !mt) return;
    const venda = x[0], mv = mt[0] * p, mm = mt[1];
    const rv = Math.max(0, (mv - venda) * mm); const mg = x[2] ? x[3] / x[2] : null; const rm = ok(mg) && mg < mm ? (mm - mg) * x[2] : 0;
    const q = (E.QS[m] || {})[s] || 0, qm = (E.perdas_meta_sec[s] || 0) * x[2]; const rq = Math.max(0, q - qm);
    out.push({s, nome: E.sec_nome[s], venda, mv, rv, rm, rq, tot: rv + rm + rq}); });
  return out.sort((a, b) => b.tot - a.tot);
}
function quebra(m) { const q = E.Q[m] || {ident: 0, nao_ident: 0}; const v = V(m); return {ident: q.ident, nao: q.nao_ident, tot: q.ident + q.nao_ident, pct: v && v.var ? (q.ident + q.nao_ident) / v.var : null, tipo: q.tipo || {}}; }
function dre(m) { return E.DRE[m] || null; }
function disp(m) { const b = E.BAL[m]; return b ? (b.caixa || 0) + (b.bancos || 0) + (b.aplicacoes || 0) : null; }

/* ---------- PAGINA 1 ---------- */
function p1(m) {
  const v = V(m), c = V(cmpM(m)), aa = V(addM(m, -12)), mt = metaMes(m), mf = E.mes_fechado, d = dre(mf), dA = dre(addM(mf, -12));
  const fp = prop(m);
  const vc = c ? c.tot * (S.cmp === 'aa' ? 1 : 1) : null;
  const cards = [];
  cards.push(card({nome: 'Venda Bruta Total', valor: BRL(v.tot), selo: v.parcial ? 'Parcial' : 'Completo', farol: farolR(v.tot, mt && mt.venda), cod: 'fat',
    linhas: ['meta <b>' + BRL(mt && mt.venda) + '</b> - ' + cmpN() + ' ' + VAR(c ? v.tot / (c.tot * fp) - 1 : null), 'Varejo ' + BRL(v.var) + ' - Atacado ' + BRL(v.atac) + ' - Repasse ' + BRL(v.rep)],

  const ebp = d ? d.EBITDA / d.RB : null, adj = d ? d.EBITDA - E.pessoal.extras_mes : null;

    linhas: ['mes fechado ' + ML(mf) + ' - orcado ' + BRL((E.ORC[mf] || {}).EBITDA), 'custo de pessoal a validar <b>' + BRL(-E.pessoal.extras_mes) + '</b>/mes', 'EBITDA ajustado estimado <b>' + BRL(adj) + '</b>']}));
  cards.push(card({nome: 'Lucro Liquido', valor: BRL(d && d.LL), selo: 'Fiscal', linhas: [PCT(d ? d.LL / d.RB : null) + ' da receita bruta', 'ano ant. ' + BRL(dA && dA.LL)]}));
  const mg = v.tot ? v.luc / v.tot : null, mgc = c && c.tot ? c.luc / c.tot : null;
  cards.push(card({nome: 'Margem Bruta', valor: BRL(v.luc) + ' <small style="font-size:12px">' + PCT(mg) + '</small>', selo: 'Completo', farol: farolP(mg, E.metas_ano.margem, (E.tol || {}).margem), cod: 'margem',
    linhas: ['meta ' + PCT(E.metas_ano.margem) + ' - ' + cmpN() + ' ' + PP(ok(mg) && ok(mgc) ? mg - mgc : null)], risco: ok(mg) && mg < E.metas_ano.margem ? (E.metas_ano.margem - mg) * v.tot : 0}));
  const dsp = disp(mf), dspA = disp(addM(mf, -1));
  cards.push(card({nome: 'Geracao de Caixa', valor: BRL(ok(dsp) && ok(dspA) ? dsp - dspA : null), selo: 'Parcial', linhas: ['variacao do disponivel em ' + ML(mf), 'saldo ' + BRL(dsp) + ' (caixa + bancos)']}));
  const q = quebra(m), qc = quebra(cmpM(m));

    linhas: ['meta ' + PCT(E.metas_ano.perdas) + ' - ' + cmpN() + ' ' + PP(ok(q.pct) && ok(qc.pct) ? q.pct - qc.pct : null), BRL(q.tot) + ' (identificada ' + BRL(q.ident) + ')'], risco: Math.max(0, q.tot - (E.metas_ano.perdas || 0) * v.var)}));
  const tk = v.var / v.cup, tkc = c ? c.var / c.cup : null;

  const rs = riscoSecoes(m).filter(x => x.tot > 0); const rtot = rs.reduce((a, b) => a + b.tot, 0); let acc = 0;
  const rl = rs.slice(0, 8).map(x => { acc += x.tot; return [esc(x.nome), BRL(x.rv), BRL(x.rm), BRL(x.rq), '<b>' + BRL(x.tot) + '</b>', PCT(acc / rtot, 0)]; });

    '<div class="box"><h3>Onde agir primeiro <small>Resultado em Risco por secao - ' + BRL(rtot) + '</small></h3>' + tabela(['Secao', 'Venda', 'Margem', 'Quebra', 'Total', 'Acum.'], rl, [1, 2, 3, 4, 5]) + '<div class="leg">Venda abaixo da meta x margem da meta; pontos de margem abaixo da meta x venda; quebra acima da meta.</div></div></div>';
  const it = d ? [{n: 'Receita bruta', v: d.RB, total: 1}, {n: 'Deducoes', v: d.DED}, {n: 'CMV', v: d.CMV + (d.BON || 0) + (d.CRED || 0)}, {n: 'Quebra', v: d.PER}, {n: 'Desp. variaveis', v: d.DVAR}, {n: 'Desp. fixas', v: d.DFIX}, {n: 'EBITDA', v: d.EBITDA, total: 1}] : [];
  const atr = E.plano.filter(p => p.status === 'Atrasada'); const crit = riscoSecoes(m).filter(x => x.tot > 0).length;

    '<div class="box msg"><h3>Mensagem do mes e pauta</h3><p>' + (E.tipo === 'cons' ? 'O grupo' : 'A loja') + ' vendeu <b>' + BRL(v.tot) + '</b> em ' + ML(m) + (v.parcial ? ' (parcial)' : '') + ', ' + PCT(mt ? v.tot / mt.venda : null, 0) + ' da meta e ' + VAR(yoyT) + ' contra o ano anterior. O varejo cresceu <b>' + VAR(yoy) + '</b>; o repasse responde por ' + PCT(v.rep / v.tot) + ' da venda.</p>' +
    '<p>Resultado fiscal de ' + ML(mf) + ': EBITDA <b>' + BRL(d && d.EBITDA) + '</b>. Com o custo de pessoal a validar, o EBITDA estimado seria <b>' + BRL(adj) + '</b>.</p>' +
    (top ? '<p>Maior Resultado em Risco: <b>' + esc(top.nome) + '</b> (' + BRL(top.tot) + ').</p>' : '') +
    '<p><b>Pauta:</b> ' + atr.length + ' acoes atrasadas no plano - ' + crit + ' secoes com Resultado em Risco - responsaveis dos KPIs definidos na aba DonosIndicadores.</p></div></div>';

function rankingLojas(m) {

  const ag = o => [BRL(o.a_vencer), BRL(o.v1_30), BRL(o.v31_90), BRL(o.v90), '<b>' + BRL(o.total) + '</b>'];
  const rp = {}; (cx.receber_prox || []).forEach(x => rp[x[0]] = x[1]); const pp = {}; (cx.pagar_prox || []).forEach(x => pp[x[0]] = x[1]);
  const dias = Array.from(new Set([...Object.keys(rp), ...Object.keys(pp)])).sort().slice(0, 35);
  let acc = 0; const sal = dias.map(d => { acc += (rp[d] || 0) - (pp[d] || 0); return acc; });
  h += '<div class="grid2b"><div class="box"><h3>Contas a Receber <small>por vencimento</small></h3>' + tabela(['', 'A vencer', '1-30', '31-90', '> 90', 'Total'], [['Duplicatas'].concat(ag(cx.receber_dup)), ['Cartoes'].concat(ag(cx.receber_cartao))], [1, 2, 3, 4, 5]) + '</div>' +
    '<div class="box"><h3>Contas a Pagar <small>por vencimento</small></h3>' + tabela(['', 'A vencer', '1-30', '31-90', '> 90', 'Total'], [['Fornecedores'].concat(ag(cx.pagar_forn)), ['Total'].concat(ag(cx.pagar))], [1, 2, 3, 4, 5]) + '</div>' +
    '</div><div class="box" style="margin-bottom:10px"><h3>Fluxo de caixa previsto <small>saldo acumulado em 35 dias - so titulos ja lancados (a receber - a pagar)</small></h3>' + barras([{nome: 'Saldo acumulado', v: sal, cor: '#2b5f9e', cores: sal.map(x => x < 0 ? '#c0392b' : '#2b5f9e')}], dias.map(d => d.slice(8, 10) + '/' + d.slice(5, 7)), {h: 170, w: 1100}) + '</div>';
  const bm = Object.keys(E.BAL).sort().slice(-6);
  const bl = [['Ativo circulante', 'ativo_circ'], ['Estoque (contabil)', 'estoque'], ['Imobilizado', 'imobilizado'], ['Passivo circulante', 'passivo_circ'], ['Fornecedores', 'fornecedores'], ['Emprestimos CP', 'emprestimos_cp'], ['Emprestimos LP', 'emprestimos_lp'], ['Patrimonio liquido', 'pl']].map(([n, k]) => [n].concat(bm.map(x => BRL(E.BAL[x][k]))));
  const estERP = E.EM[mf], estC = b.estoque;
  h += '<div class="grid2"><div class="box"><h3>Balanco mensal sintetico</h3>' + tabela(['Conta'].concat(bm.map(ML)), bl, bm.map((x, i) => i + 1)) + '</div>' +
    '<div class="box"><h3>Pendencias contabeis <small>afetam caixa e capital de giro</small></h3>' + tabela(['Pendencia', 'Valor', 'Plano'], [['Estoque contabil x ERP (' + ML(mf) + ')', BRL(estC) + ' x ' + BRL(estERP) + ' = ' + BRL((estC || 0) - (estERP || 0)), 'C2'], ['Duplicatas vencidas ha mais de 1 ano', PCT(cx.inad_1ano) + ' da carteira', 'M9'], ['Cartoes sem conciliacao no ERP', 'todos os registros', 'A7'], ['Custo de pessoal fora da contabilidade', BRL(E.pessoal.extras_mes) + '/mes', 'C1'], ['Mes contabil aberto', ML(E.mes_completo) + ' em previa', 'A3']]) + '</div></div>';
  return h;
}

/* ---------- PAGINA 7 ---------- */
function p7(m) {
  const v = V(m), c = V(cmpM(m)); const part = v.var ? v.prec / v.var : null, partc = c && c.var ? c.prec / c.var : null;
  const mgp = v.prec ? v.pluc / v.prec : null, mgn = (v.var - v.prec) ? (v.lucv - v.pluc) / (v.var - v.prec) : null;
  const inv = ok(mgp) && ok(mgn) ? Math.max(0, (mgn - mgp) * v.prec) : null; const lim = E.promo.ref.loja;
  let h = '<div class="cards c4">' +
    card({nome: 'Participacao Promocional', valor: PCT(part), selo: 'Completo', cod: 'promo_part', farol: farolP(part, lim, 1, true), linhas: ['limite ' + PCT(lim) + ' (media ' + E.promo.ref.ano + ')', cmpN() + ' ' + PP(ok(partc) ? part - partc : null)]}) +
    card({nome: 'Investimento Promocional', valor: BRL(inv), selo: 'Completo', linhas: ['margem que a loja abriu mao', 'na venda em promocao de ' + ML(m)]}) +
    card({nome: 'Margem da venda em promocao', valor: PCT(mgp), selo: 'Completo', cod: 'promo_mg', linhas: ['venda normal ' + PCT(mgn), 'diferenca ' + PP(ok(mgp) && ok(mgn) ? mgp - mgn : null)]}) +
    card({nome: 'Venda em promocao', valor: BRL(v.prec), selo: 'Completo', linhas: [cmpN() + ' ' + VAR(c && c.prec ? v.prec / (c.prec * prop(m)) - 1 : null), 'so varejo']}) + '</div>';
  const sl = Object.keys(E.sec_nome).filter(s => E.SEC[s] && E.SEC[s][m] && E.SEC[s][m][4] > 0).map(s => { const x = E.SEC[s][m]; const p = x[4] / x[2]; const lim = (E.promo.ref.sec || {})[s];
    const mgp = x[4] ? x[5] / x[4] : null, mgn = (x[2] - x[4]) ? (x[3] - x[5]) / (x[2] - x[4]) : null; const iv = ok(mgp) && ok(mgn) ? Math.max(0, (mgn - mgp) * x[4]) : 0;
    return [esc(E.sec_nome[s]), BRL(x[4]), PCT(p), PCT(lim), frTxt(farolP(p, lim, 1, true)), PCT(mgp), BRL(iv), iv]; }).sort((a, b) => b[7] - a[7]).map(r => r.slice(0, 7));
  const N = E.promo.nomes || {}, sug = E.promo.sug || {};
  const lst = (arr, t) => (arr || []).slice(0, 12).map(s => [s + ' - ' + esc(NM(N[s] || E.sku_nome[s] || '')), t]);
  h += '<div class="grid2"><div class="box"><h3>Promocao por secao <small>' + ML(m) + ' - ordem pelo investimento</small></h3>' + tabela(['Secao', 'Venda promo', 'Part.', 'Limite', '', 'Margem promo', 'Investimento'], sl, [1, 2, 3, 5, 6]) + '</div>' +
    '<div class="box"><h3>Sugestoes <small>ultimas 13 semanas</small></h3>' + tabela(['Produto', 'Sugestao'], lst(sug.custo, 'abaixo do custo: rever preco').concat(lst(sug.perm, 'quase permanente: tirar da promocao ou tornar preco normal')).concat(lst(sug.pos, 'cai depois da promocao: rever frequencia'))) + '</div></div>';
  return h;
}

/* ---------- PAGINA 8 ---------- */
function p8(m) {
  const P = E.plano; const ab = P.filter(p => p.status !== 'Concluida' && p.status !== 'Concluída'); const atr = P.filter(p => p.status === 'Atrasada');
  const rs = riscoSecoes(m).filter(x => x.tot > 0); const cods = new Set(); ab.forEach(p => (p.cods || []).forEach(c => cods.add(String(c))));
  const sem = rs.filter(x => !cods.has('margem:' + x.s) && !cods.has('venda:' + x.s)); const cob = rs.length ? 1 - sem.length / rs.length : null;
  const ganho = ab.reduce((a, p) => a + (p.impacto || 0), 0);
  let h = '<div class="cards c5">' +
    card({nome: 'Acoes abertas', valor: NUM(ab.length), linhas: ['nao iniciadas ' + NUM(P.filter(p => /iniciada/.test(p.status)).length)]}) +
    card({nome: 'Acoes vencidas', valor: NUM(atr.length), farol: atr.length ? 'c' : 'v', linhas: ['prazo passado e nao concluida']}) +
    card({nome: 'Criticos sem acao', valor: NUM(sem.length), farol: sem.length ? 'a' : 'v', linhas: ['secoes com Resultado em Risco', 'sem acao especifica no plano']}) +
    card({nome: 'Cobertura do Plano', valor: PCT(cob, 0), farol: farolR(cob, 1), linhas: ['Resultado em Risco com acao especifica']}) +
    card({nome: 'Ganho estimado', valor: BRL(ganho), linhas: ['soma do impacto das acoes abertas', 'validado e realizado: aba GanhosValidados']}) + '</div>';
  const ord = {Atrasada: 0}; const lst = ab.slice().sort((a, b) => (ord[a.status] == null ? 1 : 0) - (ord[b.status] == null ? 1 : 0) || String(a.prazo).localeCompare(String(b.prazo)));
  h += '<div class="grid2"><div class="box"><h3>Acoes 5W2H <small>' + ab.length + ' abertas - atrasadas primeiro</small></h3>' + tabela(['ID', 'O que', 'Por que', 'Quem', 'Executor', 'Prazo', 'Status', 'Quanto'], lst.slice(0, 60).map(p => [esc(p.id), esc(p.o_que), esc(p.por_que), esc(p.quem), esc(p.executor), esc(p.prazo), p.status === 'Atrasada' ? '<span class="fr c">Atrasada</span>' : esc(p.status), BRL(p.impacto)]), [7]) + '</div>' +
    '<div class="box"><h3>Planejado x Executado x Resultado</h3>' + tabela(['Indicador', 'Planejado', 'Executado', 'Resultado'], lst.filter(p => p.indicador).slice(0, 25).map(p => [esc(p.indicador), esc(p.meta || '-'), esc(p.status), esc(p.verif || 'sem verificacao registrada')])) + '</div></div>';
  h += '<div class="box"><h3>Pauta da Reuniao de Resultados</h3><div class="msg"><p>1. Resultado do mes (Visao do CEO) e Resultado em Risco das secoes: ' + rs.slice(0, 3).map(x => esc(x.nome) + ' ' + BRL(x.tot)).join(' - ') + '.</p><p>2. Acoes atrasadas: ' + atr.slice(0, 6).map(p => esc(p.id)).join(', ') + (atr.length > 6 ? ' e outras ' + (atr.length - 6) : '') + '.</p><p>3. Secoes criticas sem acao: ' + (sem.map(x => esc(x.nome)).join(', ') || 'nenhuma') + '.</p><p>4. Conferir os responsaveis dos indicadores (aba DonosIndicadores).</p></div></div>';
  return h;
}


/* ---------- PAGINA 0 - HOJE (resumo do CEO) ---------- */
function p0(m) {
  const v = V(m), mt = metaMes(m), mf = E.mes_fechado, d = dre(mf), fp = prop(m), cx = E.caixa, q = quebra(m);
  const proj = v.parcial ? v.tot / fp : v.tot, metaCheia = E.meta[m] && E.meta[m].venda;
  const mg = v.tot ? v.luc / v.tot : null, ebp = d ? d.EBITDA / d.RB : null, orc = E.ORC[mf], ebo = orc ? orc.EBITDA / orc.RB : null;
  const rp = {}, pp = {}; (cx.receber_prox || []).forEach(x => rp[x[0]] = x[1]); (cx.pagar_prox || []).forEach(x => pp[x[0]] = x[1]);
  const dd = Array.from(new Set([...Object.keys(rp), ...Object.keys(pp)])).sort().slice(0, 35); let acc = 0, minS = 0, minD = null;
  dd.forEach(x => { acc += (rp[x] || 0) - (pp[x] || 0); if (acc < minS) { minS = acc; minD = x; } });
  const dsp = disp(mf); const ms3 = mesesAte(m, 3); const cv90 = ms3.reduce((a, x) => a + (V(x).tot - V(x).luc), 0), d90 = ms3.reduce((a, x) => a + V(x).dcv, 0);
  const dias = ok(E.EM[m]) ? E.EM[m] / (cv90 / d90) : null; const rup = E.RUP[m];
  const fVenda = farolR(proj, metaCheia), fMg = farolP(mg, E.metas_ano.margem, (E.tol || {}).margem), fEb = farolP(ebp, ebo, 1), fQ = farolP(q.pct, E.metas_ano.perdas, 0.2, true), fDias = farolR(dias, E.metas_ano.cobertura, true);
  const cards = [
    card({nome: v.parcial ? 'Projecao de fechamento' : 'Venda do mes', valor: BRL(proj), selo: v.parcial ? 'Previa' : 'Completo', farol: fVenda, linhas: ['meta <b>' + BRL(metaCheia) + '</b> - ' + PCT(metaCheia ? proj / metaCheia : null, 0), v.parcial ? 'realizado ' + BRL(v.tot) + ' em ' + v.dcv + ' dias' : 'mes fechado']}),
    card({nome: 'Margem Bruta', valor: PCT(mg), selo: 'Completo', farol: fMg, linhas: ['meta ' + PCT(E.metas_ano.margem), PP(ok(mg) ? mg - E.metas_ano.margem : null) + ' vs meta']}),
    card({nome: 'EBITDA ' + ML(mf), valor: PCT(ebp), selo: 'Fiscal', farol: fEb, linhas: [BRL(d && d.EBITDA), 'orcado ' + PCT(ebo)]}),
    card({nome: 'Quebra %', valor: PCT(q.pct, 2), selo: 'Completo', farol: fQ, linhas: ['meta ' + PCT(E.metas_ano.perdas), BRL(q.tot)]}),
    card({nome: 'Caixa (disponivel)', valor: BRL(dsp), selo: 'Parcial', farol: minS < 0 ? 'a' : 'v', linhas: [minS < 0 ? 'pior saldo 35 d: <b>' + BRL(minS) + '</b>' : 'fluxo 35 d positivo', 'ciclo financeiro ' + nf(cx.ciclo, 1) + ' d']}),
    card({nome: 'Dias de estoque', valor: ok(dias) ? nf(dias, 1) + ' d' : '-', selo: 'Completo', farol: fDias, linhas: ['meta ' + nf(E.metas_ano.cobertura, 1) + ' d', 'excesso ' + BRL(E.estoque_resumo.valor_excesso)]})];
  const cnt = {v: 0, a: 0, c: 0}; [fVenda, fMg, fEb, fQ, fDias].forEach(x => x && cnt[x]++);
  const rs = riscoSecoes(m).filter(x => x.tot > 0), atr = E.plano.filter(p => p.status === 'Atrasada').sort((a, b) => (b.impacto || 0) - (a.impacto || 0));
  const it = [];
  rs.filter(x => x.tot > 15000).slice(0, 3).forEach(x => it.push({f: x.tot > 30000 ? 'c' : 'a', t: esc(x.nome) + '<small>venda ' + BRL(x.rv) + ' - margem ' + BRL(x.rm) + ' - quebra ' + BRL(x.rq) + ' abaixo da meta</small>', v: BRL(x.tot)}));
  if (E.tipo === 'cons') E.lojas.forEach(l => { const e = ALL[l.id], vv = e.V[m], mm = e.meta[m], f2 = vv.parcial ? +e.ref.slice(8, 10) / vv.dias : 1; const pm = mm ? vv.tot / (mm.venda * f2) : null; const dl = e.DRE[mf]; const eb = dl ? dl.EBITDA / dl.RB : null;
    if (ok(pm) && pm < 0.98) it.push({f: pm < 0.9 ? 'c' : 'a', t: esc(l.nome) + ': venda abaixo da meta', v: PCT(pm, 0)});
    if (ok(eb) && eb < 0.04) it.push({f: 'a', t: esc(l.nome) + ': EBITDA baixo em ' + ML(mf) + '<small>abaixo de 4% da receita bruta</small>', v: PCT(eb)}); });
  if (atr.length) it.push({f: 'c', t: atr.length + ' acoes atrasadas no plano<small>maior: ' + esc(atr[0].o_que) + ' (' + esc(atr[0].executor) + ')</small>', v: BRL(atr.reduce((a, p) => a + (p.impacto || 0), 0))});
  if (minS < 0) it.push({f: 'a', t: 'Caixa: saldo previsto negativo em ' + minD.slice(8, 10) + '/' + minD.slice(5, 7) + '<small>so titulos ja lancados (a receber - a pagar)</small>', v: BRL(minS)});
  if (cx.inad_30 > 0.05) it.push({f: 'a', t: 'Inadimplencia acima de 30 dias acima da meta', v: PCT(cx.inad_30)});
  if (ok(rup) && rup > E.metas_ano.ruptura_giro) it.push({f: 'a', t: 'Ruptura de gondola acima da meta<small>' + NUM(E.rup_atual.sinalizados) + ' itens sinalizados</small>', v: PCT(rup)});
  if (fDias && fDias !== 'v') it.push({f: fDias, t: 'Estoque acima do ideal: liberar capital de giro', v: BRL(E.estoque_resumo.valor_excesso)});
  const lista = it.length ? '<ul class="dec">' + it.map(x => '<li><span class="dot ' + x.f + '"></span><span class="tx">' + x.t + '</span><span class="vl">' + x.v + '</span></li>').join('') + '</ul>' : '<p class="msg">Nenhum desvio relevante neste mes.</p>';
  const ver = '<div class="veredito">' + (E.tipo === 'cons' ? 'O grupo' : 'A loja') + ' <b>' + (v.parcial ? 'projeta ' : 'fechou ') + BRL(proj) + '</b> em ' + ML(m) + ' (' + PCT(metaCheia ? proj / metaCheia : null, 0) + ' da meta), margem bruta <b>' + PCT(mg) + '</b> e EBITDA de <b>' + PCT(ebp) + '</b> em ' + ML(mf) + '. ' +
    (cnt.c ? '<b>' + cnt.c + ' indicador(es) critico(s)</b>' : 'Nenhum indicador critico') + ' e ' + cnt.a + ' em atencao. ' + (it.length ? 'Pauta de hoje: ' + it.length + ' ponto(s) para decidir.' : '') + '</div>';
  const ms = mesesAte(m, 13);
  const g1 = barras([{nome: 'Venda Bruta Total', v: ms.map(x => V(x).tot), cor: '#2b5f9e', cores: ms.map(x => V(x).parcial ? '#9bb8dc' : '#2b5f9e')}, {nome: 'Meta', tipo: 'linha', v: ms.map(x => E.meta[x] ? E.meta[x].venda : null), cor: '#c8962e'}, {nome: 'Ano anterior', tipo: 'linha', tra: 1, v: ms.map(x => V(addM(x, -12)) ? V(addM(x, -12)).tot : null), cor: '#7f8c8d'}], ms.map(ML));
  return ver + '<div class="cards c6">' + cards.join('') + '</div><div class="grid2"><div class="box"><h3>O que exige decisao <small>ordenado por impacto</small></h3>' + lista + '</div>' +
    '<div class="box"><h3>Lojas <small>' + ML(m) + '</small></h3>' + rankingLojas(m) + '</div></div>' + '<div class="box"><h3>Venda 13 meses x meta x ano anterior</h3>' + g1 + '</div>';
}

/* ---------- navegacao ---------- */
const FN = {0: p0, 1: p1, 2: p2, 3: p3, 4: p4, 5: p5, 6: p6, 7: p7, 8: p8};
function render() {
  const m = S.m, v = V(m);
  $('#titulo').textContent = PAG.find(x => x[0] === S.pg)[1];
  $('#subt').textContent = E.empresa + ' - ' + ML(m) + (v.parcial ? ' (em andamento, ' + v.dcv + ' de ' + v.dias + ' dias)' : '') + ' - resultado contabil: ultimo mes fechado ' + ML(E.mes_fechado);
  $('#fInfo').textContent = v.parcial ? 'Mes em andamento: meta e comparacoes proporcionais aos dias com venda' : '';
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', +b.dataset.p === S.pg));
  try { $('#pg').innerHTML = FN[S.pg](m); } catch (e) { $('#pg').innerHTML = '<div class="aviso">Nao foi possivel montar esta pagina: ' + esc(e.message) + '</div>'; console.error(e); }
}
function modal(h) { $('#modalin').innerHTML = h + '<div style="text-align:right;margin-top:10px"><button class="btn" onclick="document.getElementById(\'modal\').hidden=true">Fechar</button></div>'; $('#modal').hidden = false; }
function iniciar() {
  $('#menu').innerHTML = PAG.map(p => '<button data-p="' + p[0] + '"><b>' + (p[0] || '\u2605') + '</b><span class="l">' + p[1] + '</span><span class="s">' + p[2] + '</span></button>').join('');
  $('#menu').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; S.pg = +b.dataset.p; render(); window.scrollTo(0, 0); });
  const ms = E.meses.filter(x => x >= '2025-01').slice().reverse();
  $('#fMes').innerHTML = ms.map(x => '<option value="' + x + '">' + ML(x) + (E.V[x].parcial ? ' (em andamento)' : '') + '</option>').join('');
  S.m = E.mes_completo; $('#fMes').value = S.m;
  $('#fLoja').innerHTML = '<option value="todas">Todas (consolidado)</option>' + E.lojas.map(l => '<option value="' + l.id + '">' + esc(l.nome) + '</option>').join('');
  $('#fMes').onchange = e => { S.m = e.target.value; render(); };
  $('#fLoja').onchange = e => { S.loja = e.target.value; E = ALL[S.loja]; render(); };
  $('#fCmp').onchange = e => { S.cmp = e.target.value; render(); };
  $('#atual').textContent = 'METODEX CEO v' + E.versao + ' - DEMONSTRACAO (dados simulados) - dados ate ' + E.ref;
  $('#selo').innerHTML = '<span class="chip s-Completo">Completo</span> <span class="chip s-Parcial">Parcial</span> <span class="chip s-Fiscal">Fiscal</span> <span class="chip s-Previa">Previa</span>';
  $('#bSiglas').onclick = () => modal('<h3 style="margin-bottom:8px">Siglas e selos</h3>' + tabela(['Sigla', 'Significado'], SIGLAS.map(s => [s[0], s[1]])));
  $('#bFontes').onclick = () => modal('<h3 style="margin-bottom:8px">Atualizacao das fontes</h3>' + tabela(['Fonte', 'Dados ate'], Object.entries(E.fontes).map(([k, v]) => [esc(k), esc(v || '-')])));
  $('#modal').onclick = ev => { if (ev.target.id === 'modal') $('#modal').hidden = true; };
  render();
}
