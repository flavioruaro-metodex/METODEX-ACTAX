<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>METODEX Dashboard Tatico - Demonstracao</title>
<style>
:root{--bg:#f4f6f9;--surf:#fff;--ink:#0f2742;--mut:#5b6b7d;--line:#d5dce5;--zebra:#f6f8fb;--gold:#c8962e;--v:#1e8e4e;--a:#d08a00;--c:#c0392b;--n:#7f8c8d;--blue:#2b5f9e;--blue2:#9bb8dc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;overflow-x:hidden}
[hidden]{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:30px;width:100%;max-width:400px;text-align:center}
.lockbox h1{font-size:19px;margin-bottom:4px}.lockbox p{color:var(--mut);font-size:12px;margin-bottom:4px}
.lockbox form{display:flex;flex-direction:column;gap:10px;margin:18px 0 8px}
.lockbox input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
.lockerr{color:var(--c);min-height:18px;font-size:12px}
.lockup{display:inline-flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid #c8962e;box-shadow:0 4px 14px rgba(15,39,66,.22);margin-bottom:14px;background:#fff}
.lockup .lk-m{background:#0b1a33;display:flex;align-items:center}.lockup .lk-m img{height:74px;width:auto;display:block}
.lockup .lk-a{display:flex;align-items:center;padding:0 18px;border-left:2px solid #c8962e;background:#fff}.lockup .lk-a img{height:36px;width:auto;display:block}
.lockup.xs{border-radius:7px;margin:0;box-shadow:none}.lockup.xs .lk-m img{height:30px}.lockup.xs .lk-a{padding:0 10px}.lockup.xs .lk-a img{height:15px}
header{background:var(--surf);border-bottom:1px solid var(--line);padding:8px 16px;position:sticky;top:0;z-index:5}
.hd1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hd1 .tt{display:flex;align-items:center;gap:12px}.hd1 h2{font-size:17px}.hd1 .sub{color:var(--mut);font-size:11.5px}
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.filtros label{font-size:11px;color:var(--mut);display:flex;gap:5px;align-items:center}
.filtros select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:var(--ink)}
.chip{font-size:10.5px;border-radius:10px;padding:2px 8px;font-weight:600;display:inline-block;white-space:nowrap}
.s-Fiscal{background:#e6eef8;color:var(--blue)}.s-Gerencial{background:#fdf0dc;color:#9a6400}.s-Demo{background:#fdf0dc;color:#9a6400}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.tabs button{background:#eef2f7;border:0;border-radius:8px 8px 0 0;padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
section.pg{padding:12px 16px 30px}
.cards{display:grid;gap:8px;margin-bottom:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--n);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.card.v{border-left-color:var(--v)}.card.a{border-left-color:var(--a)}.card.c{border-left-color:var(--c)}
.card .t{font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;gap:4px}.card .val{font-size:21px;font-weight:700;margin-top:2px}.card .ln{font-size:10.8px;color:var(--mut);line-height:1.35}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-bottom:10px}.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0;overflow-x:auto;margin-bottom:10px}.grid2 .box,.grid2b .box{margin-bottom:0}
.box h3{font-size:12.5px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}.box h3 small{font-weight:400;color:var(--mut);font-size:10.5px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:4px 6px;border:1px solid #2a4566;white-space:nowrap}
td{padding:3px 6px;border:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
tr:nth-child(even) td{background:var(--zebra)}tr.tot td{font-weight:700;background:#e9eef5}tr.sub td{font-weight:700;background:#f1f4f9}tr.gr td{background:#dfe7f1;font-weight:700;color:var(--ink)}
td.ok{color:var(--v);font-weight:700;text-align:center}td.er{color:var(--c);font-weight:700;text-align:center}td.neg{color:var(--c)}
.leg{font-size:10.5px;color:var(--mut);margin-top:4px}.aviso{background:#fff8e6;border:1px solid #f0d59a;border-radius:8px;padding:6px 10px;font-size:11.5px;margin-bottom:10px}
svg text{font-family:inherit}
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid2b{grid-template-columns:1fr}}
@media (max-width:760px){header{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}.hd1 h2{font-size:15px}.hd1 .sub{display:none}.box svg{min-width:520px}section.pg{padding:10px}.card .val{font-size:18px}}
</style>
</head>

const $ = s => document.querySelector(s);

const nf = (v, d) => Number(v).toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d});
const ok = v => v != null && isFinite(v);

const BRL = v => { if (!ok(v)) return '-'; const a = Math.abs(v), s = v < -0.5 ? '-' : ''; if (a >= 1e6) return s + 'R$ ' + nf(a/1e6, 2) + ' mi'; if (a >= 1e4) return s + 'R$ ' + nf(a/1e3, 1) + ' mil'; return s + 'R$ ' + nf(a, 0); };

const MESN = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function card(o) { return '<div class="card ' + (o.f || '') + '"><div class="t"><span>' + o.n + '</span>' + (o.s ? '<span class="chip s-' + o.s + '">' + o.s + '</span>' : '') + '</div><div class="val">' + o.v + '</div>' + (o.l || []).map(x => '<div class="ln">' + x + '</div>').join('') + '</div>'; }

function barras(series, rotulos, opt) {
  opt = opt || {}; const W = 640, H = 190, pl = 58, pb = 22, pt = 10, pr = 8;
  const vals = series.flatMap(s => s.v.filter(ok)); const mx = (Math.max(0, ...vals) || 1) * 1.08, mn = Math.min(0, ...vals) * 1.08;
  const n = rotulos.length, bw = (W - pl - pr) / n, y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';

  series.forEach((s, j) => { const w = bw * 0.78 / series.length; s.v.forEach((v, i) => { if (!ok(v)) return; const x = pl + i * bw + bw * 0.11 + j * w; const y0 = y(Math.max(0, v)), y1 = y(Math.min(0, v));

function cascata(itens) {

  pts.forEach((p, i) => { const x = pl + i * bw + bw * 0.12, w = bw * 0.76, top = y(Math.max(p.a, p.b)), h = Math.max(1, Math.abs(y(p.a) - y(p.b))); const cor = p.t ? '#2b5f9e' : (p.b >= p.a ? '#1e8e4e' : '#c0392b');

      '<text x="' + (x + w / 2) + '" y="' + (H - 24) + '" font-size="9" text-anchor="middle" fill="#5b6b7d">' + esc(p.n.split('|')[0]) + '</text><text x="' + (x + w / 2) + '" y="' + (H - 13) + '" font-size="9" text-anchor="middle" fill="#5b6b7d">' + esc(p.n.split('|')[1] || '') + '</text>'; });

  const pr = Object.keys(TXT).map(k => ({c: [esc(TXT[k][0]), R(P[k]), R(ytd(e.ponte, m, k)), esc(TXT[k][1])]}));
  pr.unshift({cls: 'sub', c: ['EBITDA Fiscal', R(eF), R(yF('EBITDA')), 'Base contabil (DRE Fiscal)']}); pr.push({cls: 'tot', c: ['EBITDA Gerencial', R(eG), R(yG('EBITDA')), 'Base de gestao']});
  const it = [{n: 'EBITDA|Fiscal', v: eF, total: 1}].concat(Object.keys(TXT).map(k => ({n: TXT[k][0].split(' ').slice(0, 2).join(' ') + '|' + TXT[k][0].split(' ').slice(2, 4).join(' '), v: P[k]}))).concat([{n: 'EBITDA|Gerencial', v: eG, total: 1}]);
  h += '<div class="grid2"><div class="box"><h3>Ponte do EBITDA: Fiscal -> Gerencial <small>' + ML(m) + '</small></h3>' + cascata(it) + '</div><div class="box"><h3>Adequacoes <small>mes e acumulado do ano</small></h3>' + tabela(['Ajuste', ML(m), 'Ano', 'O que e'], pr, [1, 2]) + '</div></div>';
  const ms = ALL.meta.meses.filter(x => x <= m).slice(-13);
  h += '<div class="box"><h3>EBITDA 13 meses: Fiscal x Gerencial</h3>' + barras([{nome: 'EBITDA Fiscal', cor: '#2b5f9e', v: ms.map(x => e.fisc[x].EBITDA)}, {nome: 'EBITDA Gerencial', cor: '#c8962e', v: ms.map(x => e.ger[x].EBITDA)}], ms.map(ML)) + '</div>';
  return h;
}

/* ---------- ABA 2: Balanco ---------- */
const BLOCOS = [
  ['ATIVO', null], ['Ativo circulante', ['1.1.01', '1.1.02', '1.1.03', '1.1.04', '1.1.05', '1.1.06'], 'AC'], ['Ativo nao circulante', ['1.2.01', '1.2.02'], 'ANC'], ['TOTAL DO ATIVO', null, 'TA'],
  ['PASSIVO E PATRIMONIO LIQUIDO', null], ['Passivo circulante', ['2.1.01', '2.1.02', '2.1.03', '2.1.04', '2.1.05'], 'PC'], ['Passivo nao circulante', ['2.2.01', '2.2.02'], 'PNC'],
  ['Patrimonio liquido', ['3.1.01', '3.2.01', 'RESEX'], 'PL'], ['TOTAL DO PASSIVO + PL', null, 'TP']];
function balVal(e, m, a) { return (e.bal[m] || {})[a] || 0; }
function bloco(e, m, accs) { return accs.reduce((s, a) => s + balVal(e, m, a), 0); }
function t2(m) {
  const cons = S.emp === 'C', e = ENT(), mp = addM(m, -1), M = ALL.ent['1'], Fi = ALL.ent['2'];
  const nome = a => a === 'RESEX' ? 'Resultado do exercicio (acumulado no ano)' : ALL.meta.acc[a][0];
  const val = (ent, mm, a) => balVal(ent, mm, a);
  const elim = (a, mm) => (ALL.ent.C.elim[mm] || {})[a] || 0;
  let rows = []; const tot = {};
  const cab = cons ? ['Conta', 'Matriz', 'Filial', 'Eliminacoes', 'Consolidado'] : ['Conta', ML(m), ML(mp), 'Variacao', 'Var. %'];
  const lin = (label, vals, cls) => rows.push({cls: cls || '', c: [label].concat(vals)});
  const mk = (a) => cons ? [R(val(M, m, a)), R(val(Fi, m, a)), R(-elim(a, m)), R(val(e, m, a))] : (() => { const x = val(e, m, a), y = e.bal[mp] ? val(e, mp, a) : null; return [R(x), R(y), R(y == null ? null : x - y), y ? PCT((x - y) / Math.abs(y)) : '-']; })();
  const mkSum = (accs) => cons ? [R(bloco(M, m, accs)), R(bloco(Fi, m, accs)), R(-accs.reduce((s, a) => s + elim(a, m), 0)), R(bloco(e, m, accs))] : (() => { const x = bloco(e, m, accs), y = e.bal[mp] ? bloco(e, mp, accs) : null; return [R(x), R(y), R(y == null ? null : x - y), y ? PCT((x - y) / Math.abs(y)) : '-']; })();
  const ATIVO = [].concat(BLOCOS[1][1], BLOCOS[2][1]), PASS = [].concat(BLOCOS[5][1], BLOCOS[6][1], BLOCOS[7][1]);
  BLOCOS.forEach(b => {
    if (b[0] === 'ATIVO' || b[0].startsWith('PASSIVO E')) { rows.push({cls: 'gr', c: [b[0], '', '', '', '']}); return; }
    if (b[2] === 'TA') { lin('TOTAL DO ATIVO', mkSum(ATIVO), 'tot'); return; }
    if (b[2] === 'TP') { lin('TOTAL DO PASSIVO + PL', mkSum(PASS), 'tot'); return; }
    b[1].forEach(a => lin('&nbsp;&nbsp;' + esc(nome(a)), mk(a)));
    lin(b[0], mkSum(b[1]), 'sub');
  });
  const ac = bloco(e, m, BLOCOS[1][1]), pc = bloco(e, m, BLOCOS[5][1]), cx = balVal(e, m, '1.1.01'), div = balVal(e, m, '2.1.04') + balVal(e, m, '2.2.01');
  const ltm = ALL.meta.meses.filter(x => x <= m).slice(-12).reduce((s, x) => s + e.fisc[x].EBITDA, 0);
  let h = '<div class="cards">' +
    card({n: 'Liquidez corrente', s: 'Fiscal', v: nf(ac / pc, 2), l: ['ativo circulante / passivo circulante'], f: ac / pc >= 1 ? 'v' : 'c'}) +
    card({n: 'Capital de giro liquido', s: 'Fiscal', v: BRL(ac - pc), l: ['AC - PC em ' + ML(m)]}) +
    card({n: 'Divida liquida', s: 'Fiscal', v: BRL(div - cx), l: ['emprestimos ' + BRL(div) + ' - caixa ' + BRL(cx)]}) +
    card({n: 'Divida liquida / EBITDA (12m)', s: 'Fiscal', v: ltm > 0 ? nf((div - cx) / ltm, 2) + 'x' : '-', l: ['EBITDA fiscal 12 meses ' + BRL(ltm)], f: ltm > 0 && (div - cx) / ltm <= 2 ? 'v' : 'a'}) + '</div>';
  h += '<div class="box"><h3>Balanco patrimonial <small>' + esc(NOME[S.emp] || e.nome) + ' - ' + ML(m) + ' - R$</small></h3>' + tabela(cab, rows, [1, 2, 3, 4]) +
    '<div class="leg">Gerado do mesmo razao da DRE e do Fluxo de Caixa. ' + (cons ? 'Eliminacoes: partes relacionadas (taxa de gestao a receber/pagar) e mutuo entre Matriz e Filial.' : '') + '</div></div>';
  const info = e.info[m] || [];
  if (info.length) h += '<div class="box"><h3>Pendencias e reconciliacoes de gestao <small>' + ML(m) + '</small></h3>' + tabela(['Item', 'Contabil', 'Sistema/Outra ponta', 'Diferenca', 'Tratamento'], info.map(i => [esc(i[0]), R(i[1]), R(i[2]), R(i[1] - i[2]), esc(i[3])]), [1, 2, 3]) + '</div>';
  return h;
}

/* ---------- ABA 3: Fluxo de Caixa ---------- */
const IND = [['LL', 'Lucro liquido do periodo (DRE Fiscal)', 0], ['DEP', '(+) Depreciacao e amortizacao', 0], ['dClientes', '(+/-) Clientes', 0], ['dEstoques', '(+/-) Estoques', 0], ['dImpRec', '(+/-) Impostos a recuperar', 0], ['dOutros', '(+/-) Outros ativos', 0], ['dParteRec', '(+/-) Partes relacionadas a receber', 0], ['dFornec', '(+/-) Fornecedores', 0], ['dObrig', '(+/-) Obrigacoes trabalhistas e despesas a pagar', 0], ['dTrib', '(+/-) Tributos a recolher', 0], ['dPartePag', '(+/-) Partes relacionadas a pagar', 0]];
const DIR = [['rec_clientes', '(+) Recebimentos de clientes'], ['rec_partes_rel', '(+) Recebimentos de partes relacionadas'], ['rec_creditos', '(+) Creditos tributarios recebidos'], ['pag_fornecedores', '(-) Pagamentos a fornecedores (liquido de bonificacoes)'], ['pag_partes_rel', '(-) Pagamentos a partes relacionadas'], ['pag_despesas', '(-) Despesas operacionais (pessoal, ocupacao, outras)'], ['pag_tributos', '(-) Tributos sobre vendas'], ['pag_ir', '(-) IR/CSLL'], ['ope_fin', '(+/-) Resultado financeiro'], ['ope_nop', '(+/-) Nao operacional']];
function t3(m) {
  const e = ENT(), ms = mesesAno(m), y = (obj, k) => ms.reduce((a, x) => a + (obj[x][k] || 0), 0);
  const ini = e.dir[ms[0]].INI;
  const linInd = IND.map(r => ({c: [esc(r[1]), R(e.ind[m][r[0]]), R(y(e.ind, r[0]))]}));
  const fim = e.dir[m].FIM;
  const comum = (src) => [{cls: 'sub', c: ['Caixa das operacoes (CFO)', R(src[m].CFO), R(y(src, 'CFO'))]}, {c: ['(-) Investimentos: imobilizado (capex) e mutuo entre empresas', R(src[m].INV), R(y(src, 'INV'))]},
    {c: ['(-) Financiamentos: amortizacao de emprestimos e distribuicao de lucros', R(src[m].FIN), R(y(src, 'FIN'))]}, {cls: 'tot', c: ['Variacao de caixa', R(src[m].VAR), R(y(src, 'VAR'))]},
    {c: ['Caixa inicial', R(src[m].INI), R(ini)]}, {cls: 'tot', c: ['Caixa final (= Balanco)', R(src[m].FIM), R(fim)]}];
  const linDir = DIR.map(r => ({c: [esc(r[1]), R(e.dir[m][r[0]]), R(y(e.dir, r[0]))]}));
  const igual = Math.abs(e.dir[m].CFO - e.ind[m].CFO) < 0.5 && Math.abs(e.dir[m].VAR - e.ind[m].VAR) < 0.5;
  let h = '<div class="cards">' + card({n: 'Caixa das operacoes', s: 'Fiscal', v: BRL(e.dir[m].CFO), l: [ML(m) + ' - ano ' + BRL(y(e.dir, 'CFO'))]}) + card({n: 'Variacao de caixa', v: BRL(e.dir[m].VAR), l: ['ano ' + BRL(y(e.dir, 'VAR'))]}) +
    card({n: 'Caixa final', v: BRL(fim), l: ['igual ao caixa do Balanco']}) + card({n: 'Metodo direto = indireto?', v: igual ? 'Sim' : 'Nao', f: igual ? 'v' : 'c', l: ['os dois chegam ao mesmo caixa']}) + '</div>';
  h += '<div class="grid2b"><div class="box"><h3>Fluxo de caixa - metodo INDIRETO <small>parte do lucro liquido - R$</small></h3>' + tabela(['Linha', ML(m), 'Acumulado ano'], linInd.concat(comum(e.ind)), [1, 2]) + '</div>' +
    '<div class="box"><h3>Fluxo de caixa - metodo DIRETO <small>recebimentos e pagamentos - R$</small></h3>' + tabela(['Linha', ML(m), 'Acumulado ano'], linDir.concat(comum(e.dir)), [1, 2]) + '</div></div>';
  const mm = ALL.meta.meses.filter(x => x <= m).slice(-13);
  h += '<div class="box"><h3>Caixa final por mes e caixa das operacoes</h3>' + barras([{nome: 'Caixa final', cor: '#2b5f9e', v: mm.map(x => e.dir[x].FIM)}, {nome: 'Caixa das operacoes (CFO)', cor: '#1e8e4e', v: mm.map(x => e.dir[x].CFO)}], mm.map(ML)) + '</div>';
  if (S.emp === 'C') h += '<div class="aviso">No consolidado, recebimentos e pagamentos entre Matriz e Filial (taxa de gestao) se anulam; o mutuo entre as empresas tambem.</div>';
  return h;
}

/* ---------- ABA 4: Balancete ---------- */
function t4(m) {
  const e = ENT(), bt = e.bt[m]; let tot = [0, 0, 0, 0, 0, 0];
  const grupos = {'1': 'ATIVO', '2': 'PASSIVO', '3': 'PATRIMONIO LIQUIDO', '4': 'CONTAS DE RESULTADO - RECEITAS', '5': 'CONTAS DE RESULTADO - DESPESAS'}; let last = ''; const rows = [];
  Object.keys(bt).sort().forEach(a => { const g = a[0]; if (g !== last) { rows.push({cls: 'gr', c: [grupos[g], '', '', '', '', '', '']}); last = g; }
    const x = bt[a], nat = ALL.meta.acc[a][2]; const elim = S.emp === 'C' && x[3] === 0 && x[1] + x[2] > 0 && ['1.1.06', '2.1.05', '1.2.02', '2.2.02'].includes(a);
    rows.push({c: [a, esc(ALL.meta.acc[a][0]) + (elim ? ' <small>(eliminado)</small>' : ''), nat === 'D' ? 'D' : 'C', R(x[0]), R(x[1]), R(x[2]), R(x[3])]});
    tot[1] += x[1]; tot[2] += x[2]; });
  rows.push({cls: 'tot', c: ['', 'TOTAL DO MOVIMENTO', '', '', R(tot[1]), R(tot[2]), tot[1] === tot[2] || Math.abs(tot[1] - tot[2]) < 1 ? 'fecha' : 'NAO FECHA']});
  return '<div class="box"><h3>Balancete de verificacao <small>' + esc(NOME[S.emp] || e.nome) + ' - ' + ML(m) + ' - R$ - saldo na natureza da conta (D/C)</small></h3>' + tabela(['Codigo', 'Conta', 'Nat.', 'Saldo inicial', 'Debitos', 'Creditos', 'Saldo final'], rows, [3, 4, 5, 6]) +
    '<div class="leg">Contas de resultado (grupos 4 e 5) acumulam o ano e sao encerradas em janeiro contra Lucros acumulados. O Balanco e a DRE sao totalizacoes deste balancete.</div></div>';
}

/* ---------- ABA 5: Conferencia ---------- */
function t5(m) {
  const e = ENT(), ck = e.chk[m]; const ms = ALL.meta.meses.filter(x => x <= m).slice(-12);
  const rows = ck.map((c, i) => { const d = c[1] - c[2], ok1 = Math.abs(d) < 1; return {c: [esc(c[0]), R(c[1]), R(c[2]), R(d), '<span class="' + (ok1 ? 'ok' : 'er') + '">' + (ok1 ? 'OK' : 'DIVERGE') + '</span>']}; });
  const falhas = ms.reduce((a, x) => a + e.chk[x].filter(c => Math.abs(c[1] - c[2]) >= 1).length, 0);
  let h = '<div class="cards">' + card({n: 'Conferencias do mes', v: rows.filter(r => /OK/.test(r.c[4])).length + ' / ' + rows.length, f: rows.every(r => /OK/.test(r.c[4])) ? 'v' : 'c', l: [ML(m)]}) +
    card({n: 'Divergencias em 12 meses', v: String(falhas), f: falhas ? 'c' : 'v', l: ['Balanco, DRE, Fluxo e Balancete']}) + card({n: 'Mes contabil', v: ML(ALL.meta.mes_fechado), l: ['ultimo mes fechado']}) + card({n: 'Fontes', v: 'Razao unico', l: ['mesmo motor gera as 4 demonstracoes']}) + '</div>';
  h += '<div class="box"><h3>Sinergia entre as demonstracoes <small>' + esc(NOME[S.emp] || e.nome) + ' - ' + ML(m) + '</small></h3>' + tabela(['Conferencia', 'Valor A', 'Valor B', 'Diferenca', 'Status'], rows, [1, 2, 3]) + '</div>';
  const mat = ms.map(x => ({c: [ML(x)].concat(e.chk[x].map(c => '<span class="' + (Math.abs(c[1] - c[2]) < 1 ? 'ok' : 'er') + '">' + (Math.abs(c[1] - c[2]) < 1 ? 'OK' : 'X') + '</span>'))}));
  h += '<div class="box"><h3>Historico das conferencias <small>cada coluna e uma conferencia da tabela acima, na mesma ordem</small></h3>' + tabela(['Mes'].concat(ck.map((c, i) => String(i + 1))), mat) + '</div>';
  return h;
}

const FN = [t1, t2, t3, t4, t5];
function render() {
  $('#titulo').textContent = TABS[S.tab].replace('Resultado: ', 'Resultado: ');
  $('#subt').textContent = 'Resultado e Posicao - ' + (NOME[S.emp] || ENT().nome) + ' - ' + ML(S.m);
  document.querySelectorAll('#tabs button').forEach((b, i) => b.classList.toggle('on', i === S.tab));
  try { $('#pg').innerHTML = FN[S.tab](S.m); } catch (er) { $('#pg').innerHTML = '<div class="aviso">Nao foi possivel montar: ' + esc(er.message) + '</div>'; console.error(er); }
}
function iniciar() {
  ALL.ent.C.nome = 'Consolidado';
  $('#tabs').innerHTML = TABS.map((t, i) => '<button data-i="' + i + '">' + (i + 1) + ' ' + t + '</button>').join('');
  $('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; S.tab = +b.dataset.i; render(); window.scrollTo(0, 0); });
  $('#fEmp').innerHTML = [['C', 'Consolidado (com eliminacoes)']].concat(ALL.meta.entidades.map(x => [x.id, x.nome])).map(x => '<option value="' + x[0] + '">' + esc(x[1]) + '</option>').join('');
  $('#fMes').innerHTML = ALL.meta.meses.slice().reverse().map(x => '<option value="' + x + '">' + ML(x) + '</option>').join('');
  S.m = ALL.meta.mes_fechado; $('#fMes').value = S.m;
  $('#fEmp').onchange = e => { S.emp = e.target.value; render(); }; $('#fMes').onchange = e => { S.m = e.target.value; render(); };
  $('#fInfo').textContent = 'Valores em R$ - dados simulados';
  render();
}
</script>
</body>
</html>
